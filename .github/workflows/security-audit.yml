name: Security Audit, Testing Suite & Automated Safeguards

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run every Monday morning at 05:00 UTC (10:30 AM IST)
    - cron: '0 5 * * 1'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab anytime

jobs:
  security-and-qa:
    name: Rigorous Security & QA Pipeline
    runs-on: ubuntu-latest

    env:
      CI: 'true'
      NODE_ENV: 'test'
      PORT: '3000'
      ADMIN_EMAIL: 'trustee@nonprofit.org'
      ADMIN_PASSWORD: 'DemoTrustee2026!'
      JWT_SECRET: 'demo-jwt-secret-audit-key-2026'
      DATA_ENCRYPTION_KEY: 'demo-encryption-salt-dev-only-2026'
      RESEND_API_KEY: 'mock_resend_api_key_ci_2026'
      PAYPAL_DIVYA_CLIENT_ID: 'mock_paypal_divya_client_id_ci'
      PAYPAL_DIVYA_CLIENT_SECRET: 'mock_paypal_divya_client_secret_ci'
      PAYPAL_RELAXATION_CLIENT_ID: 'mock_paypal_relaxation_client_id_ci'
      PAYPAL_RELAXATION_CLIENT_SECRET: 'mock_paypal_relaxation_client_secret_ci'
      DATABASE_URL: ''
      MOCK_EXTERNAL_APIS: 'true'

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS (Parity with Render)
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Production & Dev Dependencies
        run: npm ci

      - name: 1. Deep Secret & PII Exposure Scan
        run: npm run scan:secrets

      - name: 2. Dependency Vulnerability Audit (Scoped to Production)
        run: npm run audit:check

      - name: 3. Core Unit & Integration Testing Suite (Jest)
        run: npm test

      - name: 4. Verify Production TypeScript Build & Compile Assets
        run: npm run build

      - name: 5. Install Playwright Headless Browsers
        run: npx playwright install --with-deps chromium

      - name: 6. End-to-End Donor Journey Testing Suite (Playwright)
        run: npm run test:e2e
